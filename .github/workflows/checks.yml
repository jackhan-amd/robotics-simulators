name: GPU repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m simulators check
      - run: python tools/assets.py check
      - run: python -m simulators build
      - run: python tools/audit_publication.py
      - run: git diff --check
